name: ShopPilot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Migrations Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shoppilot_test
          POSTGRES_USER: shoppilot
          POSTGRES_PASSWORD: shoppilot_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify No Missing Migrations
        working-directory: ./backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key-for-building-and-testing-only"
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Verify Database Engine is PostgreSQL
        working-directory: ./backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key-for-building-and-testing-only"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "shoppilot_test"
          DB_USER: "shoppilot"
          DB_PASSWORD: "shoppilot_test_password"
        run: |
          python -c "
          import django, os, sys
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from django.db import connection
          engine = connection.settings_dict['ENGINE']
          print(f'Resolved database engine: {engine}')
          if 'postgresql' not in engine:
              print(f'ERROR: Expected PostgreSQL but got: {engine}. Tests will not run.')
              sys.exit(1)
          print('PostgreSQL confirmed. Proceeding with tests.')
          "

      - name: Run Pytest Test Suite (PostgreSQL)
        working-directory: ./backend
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-secret-key-for-building-and-testing-only"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "shoppilot_test"
          DB_USER: "shoppilot"
          DB_PASSWORD: "shoppilot_test_password"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npm run build
