version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shoppilot_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-shoppilot}
      POSTGRES_USER: ${DB_USER:-shoppilot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    # No exposed ports to host in production!
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - shoppilot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shoppilot_prod_redis
    restart: always
    # No exposed ports to host in production!
    volumes:
      - redis_prod_data:/data
    networks:
      - shoppilot_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoppilot_prod_backend
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
    environment:
      - DJANGO_DEBUG=False
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DB_NAME=${DB_NAME:-shoppilot}
      - DB_USER=${DB_USER:-shoppilot_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-app.shoppilot.ir,api.shoppilot.ir}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://app.shoppilot.ir}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://app.shoppilot.ir,https://api.shoppilot.ir}
      - BEHIND_REVERSE_PROXY=True
    ports:
      - "8000:8000"
    networks:
      - shoppilot_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoppilot_prod_celery_worker
    restart: always
    command: celery -A config worker -l info --concurrency=4
    environment:
      - DJANGO_DEBUG=False
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DB_NAME=${DB_NAME:-shoppilot}
      - DB_USER=${DB_USER:-shoppilot_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - shoppilot_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoppilot_prod_celery_beat
    restart: always
    command: celery -A config beat -l info
    environment:
      - DJANGO_DEBUG=False
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set in .env}
      - DB_NAME=${DB_NAME:-shoppilot}
      - DB_USER=${DB_USER:-shoppilot_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - shoppilot_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shoppilot_prod_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.shoppilot.ir/api/v1}
    networks:
      - shoppilot_internal
    depends_on:
      - backend

networks:
  shoppilot_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
